skill: code-simplification-recommendations
version: 1.0.0
context:
  consumes: ["complexity_assessment", "code_files"]
  produces: ["simplification_recommendations"]
  memory: short-term
strategy:
  tools: ["read_file", "grep"]
  approach: "Generate specific actionable recommendations for code simplification"
  steps:
    - "Review complexity assessment findings"
    - "Identify top 3-5 issues impacting developer experience"
    - "Create concrete simplification suggestions with examples"
    - "Prioritize recommendations by impact on maintainability"
    - "Include agent collaboration suggestions when needed"
guardrails:
  - "Timeout after 10 minutes for recommendation generation"
  - "Focus on maximum 5 issues to avoid overwhelming output"
  - "Always provide concrete, actionable recommendations"
  - "Use standardized severity levels: Critical|High|Medium|Low"
  - "Include file_path:line_number format for references"
observability:
  trace_level: standard
  metrics: ["recommendations_generated", "issues_prioritized"]
security:
  filesystem: read-only
  network: none
  secrets: []
negotiation:
  file_conflicts: yield
  priority: 3
