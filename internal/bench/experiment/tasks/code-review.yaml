# Accurate model of Claude Code's built-in code-reviewer workflow
# Context files fetched from GitHub API via kind:shell steps (deterministic, cached by runner).
#
# Topology:
#   [parallel: fetch-git-history | fetch-previous-prs]  (kind:shell, step 0)
#       ↓
#   eligibility (step 1)
#   → pr-summary   (step 2)
#   → pr-classifier (step 2b, kind:shell, deterministic domain detection)
#   → [parallel: bug-scan | git-history-review | code-comment-audit]  (step 3)
#       bug-scan has agent_tools: [sql-specialist, auth-specialist, async-specialist]
#       Each specialist is a tool_node (full LLM node, called on-demand by bug-scan).
#       ↓               ↓                  ↓
#   score-bugs   score-history   score-comment   (kind:map, 1 LLM/issue)
#       ↓               ↓                  ↓
#   filter-bugs  filter-history  filter-comment  (kind:filter, score>=60)
#       └───────────────┴──────────────────┘
#                       ↓
#               collect-filtered        (kind:concat, deduplicate:true)
#                       ↓
#                 post-comment
id: code-review
name: Claude Code Reviewer (per-agent scoring chains + domain specialists)
description: |
  Accurate model of Claude Code's built-in code-reviewer, extended with
  domain-based static routing. pr-classifier (deterministic shell) detects
  domains (sql/auth/async). bug-scan can call specialist tool_nodes on-demand
  via agent_tools to confirm domain-specific bugs before adding them.
  Per-agent score+filter chains enable true streaming.
category: claude-code-workflow
steps:
  # ── Step 0: Context fetch (kind:shell, deterministic) ─────────────────────────
  - parallel:
    - id: fetch-git-history
      kind: shell
      name: Git History Fetcher
      shell: ./gen_git_history.sh
      writes: git_history.txt
      produces: [git_history_raw]

    - id: fetch-previous-prs
      kind: shell
      name: Previous PRs Fetcher
      shell: ./gen_previous_prs.sh
      writes: previous_prs.txt
      produces: [previous_prs_raw]

  # ── Step 1: Eligibility ───────────────────────────────────────────────────────
  - id: eligibility
    name: PR Eligibility Check
    prompt: |
      Check if this PR is eligible for review. Read pr_diff.patch and pr_description.md.
      A PR is INELIGIBLE ONLY if: (a) the diff is empty or contains only whitespace,
      (b) the PR title or description explicitly says "Draft" or "WIP",
      (c) it is a bot/automated commit (e.g. dependency bump, auto-generated code).
      An incomplete description, missing checklist, or missing issue number does NOT
      make a PR ineligible — those are review comments, not eligibility blockers.
      Report: ELIGIBLE or INELIGIBLE with reason. Be concise.
    tools: [file_read]
    file_access: read-only
    network_policy:
      forbidden_domains: ["*.com", "*.net", "*.org", "*.io"]
    produces: [eligibility_result]

  # ── Step 2: PR Summary ───────────────────────────────────────────────────────
  - id: pr-summary
    name: PR Summarizer
    prompt: |
      Summarize the PR changes concisely.
      Read pr_diff.patch and pr_description.md.
      Output: what changed, why (from description), risk surface.
      Keep under 200 words.
    tools: [file_read]
    file_access: read-only
    consumes: [eligibility_result]
    produces: [pr_summary]

  # ── Step 2b: PR Domain Classifier (deterministic) ────────────────────────────
  - id: pr-classifier
    kind: shell
    name: PR Domain Classifier (deterministic keyword matching)
    shell: ./gen_pr_domains.sh
    consumes: [pr_summary]
    produces:
      - key: pr_domains
        list_schema:
          type: string
          description: "Detected domain: 'sql', 'auth', or 'async'"

  # ── Step 3: 3 Parallel Analysis Agents ───────────────────────────────────────
  # bug-scan can call domain specialists on-demand via agent_tools (agent-as-node).
  # Each specialist is a full tool_node defined below — called only when bug-scan
  # identifies a potential domain-specific bug and wants expert confirmation.
  - parallel:
    - id: bug-scan
      name: Shallow Bug Scanner
      model: claude-sonnet-4-6
      agent_tools: [sql-specialist, auth-specialist, async-specialist]
      prompt: |
        Scan the PR diff for bugs. Read pr_diff.patch, then pr_description.md.
        Focus: bugs that will cause real failures in practice — crashes, data loss,
        security vulnerabilities, incorrect behavior, race conditions.
        Avoid: style issues, missing tests, things a linter would catch.

        You have access to domain specialist tools:
        - sql-specialist: call when you detect a potential SQL/database bug to confirm it
        - auth-specialist: call when you detect a potential auth/security bug to confirm it
        - async-specialist: call when you detect a potential concurrency/async bug to confirm it

        Only call a specialist if the detected domains (pr_domains) include the relevant domain.
        Pass the specific suspicious code snippet and your concern as "context".

        After using specialists as needed, output a JSON array of confirmed bugs:
        Each item: "[BUG] <description> (confidence: HIGH|MEDIUM|LOW)"
        If none: single-item array with "[BUG] No obvious bugs found."
      tools: [file_read]
      file_access: read-only
      consumes: [pr_summary, pr_domains]
      produces:
        - key: bug_issues
          list_schema:
            type: string
            description: "Bug issue formatted as '[BUG] <description> (confidence: HIGH|MEDIUM|LOW)'"

    - id: git-history-review
      name: Git History Reviewer
      prompt: |
        Review git history context. Read git_history.txt and pr_diff.patch.
        Identify bugs or patterns visible only with historical context.
        (e.g. a pattern that was previously removed for a good reason)
        Each item must be formatted as "[HISTORY] <description>".
        If none: single-item array with "[HISTORY] No historical context issues."
        One LLM call. SRP: ONLY git history context.
      tools: [file_read]
      file_access: read-only
      consumes: [pr_summary]
      produces:
        - key: history_issues
          list_schema:
            type: string
            description: "History issue formatted as '[HISTORY] <description>'"

    - id: code-comment-audit
      kind: shell
      name: Code Comment Extractor (deterministic)
      shell: ./gen_comment_audit.sh
      consumes: [pr_summary]
      produces:
        - key: comment_issues
          list_schema:
            type: string
            description: "Comment issue formatted as '[COMMENT] <description>'"

  # ── Per-agent score+filter chains ────────────────────────────────────────────
  - id: score-bugs
    kind: map
    name: Bug Issue Scorer
    prompt: |
      Score this single bug for confidence. Use this exact scale:
        0:   False positive. Doesn't stand up to scrutiny.
        25:  Might be real, could be a false positive.
        50:  Real but minor or unlikely in practice.
        75:  Highly likely real, important, will be hit in practice.
        100: Certain, confirmed, will happen frequently.
      IMPORTANT: If the issue text mentions "unable to complete", "files not accessible",
      "file_read", or any tool/system error — score it 0. That is a tool failure, not a real bug.
      IMPORTANT: If the issue text is a placeholder like "No obvious bugs found", "No bugs found",
      "No issues detected", or similar — score it 0. That is a non-issue sentinel.
      Return a JSON object with "score" (integer) and "issue" (the original issue text verbatim).
    file_access: read-only
    consumes: [bug_issues, pr_summary]
    produces:
      - key: scored_bugs
        schema:
          score: {type: integer, description: "Confidence score: 0, 25, 50, 75, or 100"}
          issue: {type: string, description: "The original issue text verbatim"}

  - id: filter-bugs
    kind: filter
    name: Bug Issue Filter (score >= 60)
    predicate: "score >= 60"
    consumes: [scored_bugs]
    produces: [filtered_bugs]

  - id: score-history
    kind: map
    name: History Issue Scorer
    prompt: |
      Score this single history-context issue for confidence. Use this exact scale:
        0:   False positive. Doesn't stand up to scrutiny.
        25:  Might be real, could be a false positive.
        50:  Real but minor or unlikely in practice.
        75:  Highly likely real, important, will be hit in practice.
        100: Certain, confirmed, will happen frequently.
      IMPORTANT: If the issue text mentions "unable to complete", "files not accessible",
      "file_read", or any tool/system error — score it 0. That is a tool failure, not a real issue.
      IMPORTANT: If the issue text is a placeholder like "No historical context issues", "No history issues",
      "No issues detected", or similar — score it 0. That is a non-issue sentinel.
      Return a JSON object with "score" (integer) and "issue" (the original issue text verbatim).
    file_access: read-only
    consumes: [history_issues, pr_summary]
    produces:
      - key: scored_history
        schema:
          score: {type: integer, description: "Confidence score: 0, 25, 50, 75, or 100"}
          issue: {type: string, description: "The original issue text verbatim"}

  - id: filter-history
    kind: filter
    name: History Issue Filter (score >= 60)
    predicate: "score >= 60"
    consumes: [scored_history]
    produces: [filtered_history]

  - id: score-comment
    kind: map
    name: Code Comment Issue Scorer
    prompt: |
      Score this single code-comment issue for confidence. Use this exact scale:
        0:   False positive. Doesn't stand up to scrutiny.
        25:  Might be real, could be a false positive.
        50:  Real but minor or unlikely in practice.
        75:  Highly likely real, important, will be hit in practice.
        100: Certain, confirmed, will happen frequently.
      IMPORTANT: If the issue text mentions "unable to complete", "files not accessible",
      "file_read", or any tool/system error — score it 0. That is a tool failure, not a real issue.
      IMPORTANT: If the issue text is a placeholder like "No comment issues found", "No issues",
      "No issues detected", or similar — score it 0. That is a non-issue sentinel.
      Return a JSON object with "score" (integer) and "issue" (the original issue text verbatim).
    file_access: read-only
    consumes: [comment_issues, pr_summary]
    produces:
      - key: scored_comment
        schema:
          score: {type: integer, description: "Confidence score: 0, 25, 50, 75, or 100"}
          issue: {type: string, description: "The original issue text verbatim"}

  - id: filter-comment
    kind: filter
    name: Code Comment Issue Filter (score >= 60)
    predicate: "score >= 60"
    consumes: [scored_comment]
    produces: [filtered_comment]

  # ── Collect: deterministic concat + dedup ────────────────────────────────────
  - id: collect-filtered
    kind: concat
    name: Filtered Issue Collector — deterministic merge of 3 chains
    deduplicate: true
    consumes: [filtered_bugs, filtered_history, filtered_comment]
    produces:
      - key: filtered_issues
        list_schema:
          type: string
          description: High-confidence issue from any chain

  # ── Post comment ─────────────────────────────────────────────────────────────
  - id: post-comment
    name: PR Commenter
    prompt: |
      Write the final PR review comment.
      The high-confidence issues are pre-loaded above under "## Pre-loaded inputs" as filtered_issues.
      If the array is empty: output "REVIEW_DECISION: APPROVE"
      Otherwise write a review in this exact format:

      ### Code review

      Found N issues:

      1. <brief description> (CLAUDE.md says "<...>" OR bug due to <evidence>)
      <link to file and line: https://github.com/example/repo/blob/<sha>/path#L10-L14>

      REVIEW_DECISION: REQUEST_CHANGES
    file_access: read-only
    consumes: [filtered_issues]
    produces: [review_comment]

guardrails:
  - "ELIGIBLE"        # eligibility step must output ELIGIBLE
  - "REVIEW_DECISION" # post-comment must output a decision
expected_violations: []

# ── Tool nodes (agent-as-node) ────────────────────────────────────────────────
# These are full LLM nodes called on-demand by bug-scan via tool_use.
# They are NOT scheduled by the DAG — only invoked when bug-scan calls them.
# Each node reads pr_domains and pr_diff.patch from the sandbox, then answers
# the specific question passed by bug-scan as "context".
tool_nodes:
  - id: sql-specialist
    name: SQL / Database Specialist
    model: claude-haiku-4-5-20251001
    consumes: [pr_domains]
    prompt: |
      You are an expert SQL and database code reviewer.
      Read the pr_domains list and pr_diff.patch from context.
      You are being asked to confirm or refute a specific bug concern.
      Focus ONLY on SQL/database issues:
      - SQL injection, unparameterized queries
      - Missing transactions around multi-step writes
      - N+1 query patterns, missing indexes on filtered columns
      - Schema migration risks (data loss, lock contention on large tables)
      - ORM misuse (lazy loading in loops, missing select_related)
      Answer concisely: CONFIRMED or FALSE_POSITIVE, with a brief explanation.

  - id: auth-specialist
    name: Auth / Security Specialist
    model: claude-haiku-4-5-20251001
    consumes: [pr_domains]
    prompt: |
      You are an expert authentication and security code reviewer.
      Read the pr_domains list from context.
      You are being asked to confirm or refute a specific security concern.
      Focus ONLY on auth/security issues:
      - Broken authentication flows (missing checks, bypassable conditions)
      - Insecure token storage or transmission (plaintext, weak expiry)
      - Missing authorization checks (IDOR, privilege escalation)
      - Session fixation, CSRF gaps, insecure cookie flags
      - Hardcoded secrets, credentials in code
      Answer concisely: CONFIRMED or FALSE_POSITIVE, with a brief explanation.

  - id: async-specialist
    name: Concurrency / Async Specialist
    model: claude-haiku-4-5-20251001
    consumes: [pr_domains]
    prompt: |
      You are an expert concurrency and async code reviewer.
      Read the pr_domains list from context.
      You are being asked to confirm or refute a specific concurrency concern.
      Focus ONLY on concurrency/async issues:
      - Race conditions on shared mutable state
      - Deadlocks (lock ordering, nested locks)
      - Missing synchronization (unsynchronized reads/writes)
      - Promise/goroutine leaks, unhandled rejections
      - Incorrect use of async primitives (WaitGroup misuse, channel close panic)
      Answer concisely: CONFIRMED or FALSE_POSITIVE, with a brief explanation.
