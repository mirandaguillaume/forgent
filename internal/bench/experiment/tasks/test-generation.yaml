# Story 10-9: augmented for Epic 10 contract validation
# - step "write-table-tests": loop with max_iterations: 5, exit on "func Test" marker
#   (test writing is iterative; exits when first test function is generated)
id: test-generation
name: Test Generation
description: Generate comprehensive tests for a sorting function
category: test-generation
input: |
  func MergeSort(arr []int) []int {
    if len(arr) <= 1 { return arr }
    mid := len(arr) / 2
    left := MergeSort(arr[:mid])
    right := MergeSort(arr[mid:])
    return merge(left, right)
  }
  func merge(left, right []int) []int {
    result := make([]int, 0, len(left)+len(right))
    i, j := 0, 0
    for i < len(left) && j < len(right) {
      if left[i] <= right[j] { result = append(result, left[i]); i++ } else { result = append(result, right[j]); j++ }
    }
    result = append(result, left[i:]...)
    result = append(result, right[j:]...)
    return result
  }
steps:
  - id: identify-cases
    name: Identify Test Cases
    prompt: List all important test cases including edge cases and boundary conditions.
    produces: [test_cases]
  - id: write-table-tests
    name: Write Table-Driven Tests
    prompt: Write Go table-driven tests covering all identified cases.
    loop:
      max_iterations: 5
      exit_when:
        output_marker: "func Test"
    consumes: [test_cases]
    produces: [test_code]
  - id: add-property-tests
    name: Add Property Tests
    prompt: Add property-based test assertions (sorted output, same length, same elements).
    consumes: [test_code]
    produces: [property_tests]
guardrails: []
